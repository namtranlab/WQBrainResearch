[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "wqbrainsim"
version = "0.1.0"
description = "Small resumable WorldQuant BRAIN simulation client"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nam Tran", email = "vannam.tran@ntu.edu.sg" }]
dependencies = ["requests>=2.28,<3"]

[project.scripts]
wqbrainsim = "core.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.build-backend]
module-name = "core"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
